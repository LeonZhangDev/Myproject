[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# 真正的数据库 URL 会在 alembic/env.py 中从 .env 读取并覆盖这里。
sqlalchemy.url = postgresql+asyncpg://task_user:task_password@127.0.0.1:5432/task_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
