services:
  db:
    image: postgres:18
    container_name: task-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - task_pg_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: task-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    # 这里 Redis 只做缓存与限流，不是数据真相源，所以不挂持久化 volume。
    # Redis 重启后缓存清空没有关系，数据仍然保存在 PostgreSQL。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  task_pg_data:
